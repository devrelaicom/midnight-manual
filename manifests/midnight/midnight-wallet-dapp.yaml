manifest_version: 1
root:
  name: midnight-wallet-dapp
  path: .
  exclude:
    # Compiled contract output (generated .d.ts/.js + contract-info.json
    # alongside the auto-dropped zkir/prover/verifier blobs). The source
    # token-transfers.compact under src/contract/contracts/ is kept.
    - "src/contract/compiled/**"
  provenance:
    attribution: foundation
    verified: false
    verified_by: midnight-foundation
    tags: [trust:high]
