manifest_version: 1
root:
  name: midnight-leaderboard
  path: .
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/target/**"
    - "**/managed/**"
    - "**/.git/**"
    - "**/.github/**"
    - "**/.next/**"
    - "**/out/**"
    - "**/coverage/**"
    - "**/__snapshots__/**"
    - "**/.turbo/**"
    - "**/CODE_OF_CONDUCT.md"
    - "**/CONTRIBUTING.md"
    - "**/SECURITY.md"
  provenance:
    attribution: foundation
    verified: true
    verified_by: midnight-foundation
    tags: [trust:high]
