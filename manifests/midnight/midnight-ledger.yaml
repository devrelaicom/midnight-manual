manifest_version: 1
root:
  name: midnight-ledger
  path: .
  exclude:
    # Generated TypeDoc API reference (docs/ is entirely docs/api/) — the
    # canonical copy lives in midnight-docs/api-reference/.
    - "docs/**"
    # Vendored third-party source (walker skips `vendor` but not `vendored`).
    - "**/vendored/**"
    # spec/ is ingested by the `spec` child below (content_type: reference);
    # exclude it here so the root walk does not feed duplicate paths.
    - "spec/**"
  provenance:
    attribution: foundation
    verified: true
    verified_by: midnight-foundation
    tags: [trust:high]
  children:
    - name: spec
      path: spec/
      provenance: { content_type: reference }
