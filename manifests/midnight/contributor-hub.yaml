manifest_version: 1
root:
  name: contributor-hub
  path: .
  # Markdown content repo (README, Events/, legal/). The only non-prose files
  # are .github CI workflows (auto-skipped) and renovate config — not signal.
  include: ["**/*.md", "**/*.mdx"]
  provenance:
    attribution: foundation
    verified: true
    verified_by: midnight-foundation
    tags: [trust:high]
