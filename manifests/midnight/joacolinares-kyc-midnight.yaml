manifest_version: 1
root:
  name: joacolinares-kyc-midnight
  path: .
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/target/**"
    - "**/managed/**"
    - "**/.git/**"
    - "**/.github/**"
    - "**/.next/**"
    - "**/out/**"
    - "**/coverage/**"
    - "**/__snapshots__/**"
    - "**/.turbo/**"
    - "**/CODE_OF_CONDUCT.md"
    - "**/CONTRIBUTING.md"
    - "**/SECURITY.md"
  provenance:
    attribution: third_party
    verified: false
    tags: [trust:medium]
    verification_notes: >-
      LATAM Hack winner; unaffiliated with the Midnight Foundation; repo stale
      since 2025-08.
