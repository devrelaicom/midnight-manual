manifest_version: 1
root:
  name: midnight-node
  path: .
  exclude:
    # Release-note fragments (the consolidated CHANGELOG.md is kept).
    - "changes/**"
    # Generated runtime metadata blobs / data dumps.
    - "metadata/**"
    # Ingested as its own source (midnight-reserve-contracts) — avoid duplication.
    - "midnight-reserve-contracts/**"
  provenance:
    attribution: foundation
    verified: true
    verified_by: midnight-foundation
    tags: [trust:high]
