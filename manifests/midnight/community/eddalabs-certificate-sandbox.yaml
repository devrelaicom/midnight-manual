manifest_version: 1
root:
  name: eddalabs-certificate-sandbox
  path: .
  exclude:
    # Debug/golden-output dumps from tx-failure investigations (error stacks,
    # unproven-tx blobs, balance snapshots). The docs/*.md reports are kept.
    - "docs/*-artifacts/**"
  provenance:
    attribution: community
    verified: false
    tags: [trust:low]
    verification_notes: >-
      Community-contributed repository; unverified and unaudited by the Midnight
      Foundation. Indexed for ecosystem breadth; treat code and docs as
      illustrative, not authoritative, and audit before any production use.
