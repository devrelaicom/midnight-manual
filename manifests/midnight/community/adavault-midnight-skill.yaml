manifest_version: 1
root:
  name: midnight-skill
  path: .
  include: ["SKILL.md", "README.md"]
  provenance:
    attribution: community
    verified: false
    tags: [trust:low]
    verification_notes: >-
      Individual maintainer (ADAvault); unaudited; some "gotchas" sourced from
      Discord/anecdote; examples need professional audit before mainnet use.
  children:
