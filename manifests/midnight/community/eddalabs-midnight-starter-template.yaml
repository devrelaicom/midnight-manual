manifest_version: 1
root:
  name: eddalabs-midnight-starter-template
  path: .
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/target/**"
    - "**/managed/**"
    - "**/.git/**"
    - "**/.github/**"
    - "**/.next/**"
    - "**/out/**"
    - "**/coverage/**"
    - "**/__snapshots__/**"
    - "**/.turbo/**"
    - "**/CODE_OF_CONDUCT.md"
    - "**/CONTRIBUTING.md"
    - "**/SECURITY.md"
  provenance:
    attribution: community
    verified: false
    tags: [trust:low]
    verification_notes: >-
      Reclassified from partner/trust:medium to community/trust:low (2026-06-26):
      a community fork (forked repo), unverified and unaudited by the Midnight
      Foundation; audit before any production use.
