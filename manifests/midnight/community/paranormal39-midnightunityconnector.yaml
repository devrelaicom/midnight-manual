manifest_version: 1
root:
  name: paranormal39-midnightunityconnector
  path: .
  exclude:
    # Unity WebGL build-template chrome (boilerplate loader JS + demo HTML),
    # not connector source.
    - "Assets/WebGLTemplates/**"
  provenance:
    attribution: community
    verified: false
    tags: [trust:low]
