manifest_version: 1
root:
  name: learn-compact
  provenance:
    attribution: community
    verified: false
    tags: [trust:medium]
  children:
    # Content only: book/src (mdBook lessons) + exercises/ and examples/
    # (runnable Compact + prose). Drops book/static, book/theme, scripts/, and
    # netlify/site config — mdBook chrome, not signal.
    - name: intro
      file: README.md
    - name: book
      path: book/src/
      provenance:
        content_type: tutorial
    - name: exercises
      path: exercises/
    - name: examples
      path: examples/
