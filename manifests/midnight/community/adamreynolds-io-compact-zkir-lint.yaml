manifest_version: 1
root:
  name: adamreynolds-io-compact-zkir-lint
  path: .
  exclude:
    # Intentionally-buggy anti-pattern .compact demos (teach WRONG patterns in
    # isolation; the correct lessons live in docs/rules/*.md).
    - "tests/fixtures/compact/**"
    # Benchmark metadata blobs (generated by npm run benchmark:setup).
    - "bench/fixtures/*.meta.json"
    # Sample profile output (generated data blob).
    - "example-profile.json"
  provenance:
    attribution: community
    verified: false
    tags: [trust:low]
    verification_notes: >-
      Community-contributed repository; unverified and unaudited by the Midnight
      Foundation. Passed a multi-agent static review (2026-07-02): a substantial,
      Apache-2.0 static analyzer for compiled Compact ZKIR whose core ZK-divergence
      semantics (both if/else branches execute in-circuit; cond_select selects the
      result; dead-branch constraints still fire) are CORRECT and validated against
      real compiled fixtures; CQ tooling is strong (real vitest suite, CodeQL, audited
      provenance releases). CAVEATS to verify before relying on it: its docs are pinned
      to compiler 0.30.0 and its flagship DIV-001/002 rules track a compiler bug
      (compact#226) that appears already fixed in 0.31.x; its cost model conflates
      persistentHash (SHA-256, costly) with transientHash (cheap); and some compiler
      file:line citations are imprecise. Treat as illustrative, not authoritative, and
      re-verify version-status claims against current compiler output.
