manifest_version: 1
root:
  name: olanetsoft-compact-by-example
  path: .
  # Mintlify docs site — all signal is the md/mdx lessons (examples are embedded
  # in prose; no standalone .compact/.ts). Allowlist drops docs.json/robots.txt
  # site config and the images/logo/favicon assets.
  include:
    - "**/*.md"
    - "**/*.mdx"
  provenance:
    attribution: community
    verified: false
    tags: [trust:medium]
