manifest_version: 1
root:
  name: create-mn-app
  path: .
  provenance:
    attribution: foundation
    verified: true
    verified_by: midnight-foundation
    tags: [trust:high]
  children:
    # The hello-world starter payload ships as *.template files (the actual
    # starter contract/dapp source). `.template` is not a recognized extension,
    # so admit it explicitly — this is signal (the scaffolder's output).
    - name: templates
      path: templates/
      include: ["**/*.template"]
