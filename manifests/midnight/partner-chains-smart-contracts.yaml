manifest_version: 1
root:
  name: partner-chains-smart-contracts
  path: .
  # The raw-scripts/ and raw-scripts-traced/ Rust bindings embed the compiled
  # Plutus scripts as hex blobs, but they carry an "autogenerated" banner and
  # are already dropped by the walker's generated-file detection — no exclude
  # needed.
  exclude:
    # Machine-emitted script-size and execution-budget measurements.
    - "onchain/test/size_data/**"
    - "onchain/test/perf_data/**"
  provenance:
    attribution: foundation
    verified: true
    verified_by: midnight-foundation
    tags: [trust:high]
