manifest_version: 1
root:
  name: midnight-verifiable-credentials
  path: .
  exclude:
    # Test vectors and golden-output snapshots (credential/transcript JSON).
    - "**/src/test/fixtures/**"
    - "**/src/test/golden/**"
    - "**/test-fixtures/**"
    - "tooling/fixtures/**"
    # Bulk synthetic datasets for the university use-case (cohort/stress
    # student rosters). The prose in that directory (README.md,
    # data-profiles.md, request-policy-presets.md) is kept.
    - "packages/use-cases/university/data/**/*.json"
  provenance:
    attribution: foundation
    verified: false
    verified_by: midnight-foundation
    tags: [trust:high]
