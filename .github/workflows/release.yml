name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    name: release-please (version bump + CHANGELOG PR)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: rust

  release:
    name: Build and publish release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      # Build matrix per FR-099 — runs in cargo-dist's own matrix
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh

      - name: cargo dist plan
        run: cargo dist plan

      - name: cargo dist build (full matrix)
        run: cargo dist build --target=all

      - name: Verify SHA256SUMS
        run: |
          cd target/distrib
          sha256sum -c SHA256SUMS

      # Publish to crates.io (FR-101 immutability — happens exactly once per release tag)
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p mn-core
          # Subsequent crates published as they land.

      # Homebrew tap update (FR-095)
      - name: Update Homebrew tap
        uses: Justintime50/homebrew-releaser@v1
        with:
          homebrew_owner: midnight-network
          homebrew_tap: homebrew-tap
          formula_folder: Formula
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          install: |
            bin.install "midnight-manual", "mnm"

  docker-server:
    name: Build and push server Docker image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/midnight-network/midnight-manual:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/midnight-network/midnight-manual:latest
          push: true

  fly-deploy:
    name: Deploy to Fly.io
    needs: [release-please, docker-server]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --image ghcr.io/midnight-network/midnight-manual:${{ needs.release-please.outputs.tag_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
