name: CI

# INVESTIGATION BRANCH — workflow stripped to just the flakey macOS test
# cells plus diagnostic instrumentation. The full workflow lives on `main`
# and will be restored before this investigation lands.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.toolchain }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        toolchain: ["1.91.0", "stable"]
    env:
      # rust-toolchain.toml pins channel=1.91.0 for local dev; in CI we want
      # the matrix toolchain to win. RUSTUP_TOOLCHAIN overrides the file.
      # Without this, the rustup install path interacts poorly with
      # dtolnay/rust-toolchain on macOS-stable runners (intermittent
      # "unexpected argument 'test' found" rustup-init failures).
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove rust-toolchain.toml so the matrix toolchain wins
        run: rm -f rust-toolchain.toml

      # ───── Pre-toolchain diagnostic ─────
      - name: Diag — pre-toolchain state of ~/.cargo/bin
        run: |
          set +e
          echo '=== which cargo ==='
          which cargo || echo 'no cargo on PATH'
          echo '=== readlink chain ==='
          readlink "$(which cargo)" 2>/dev/null || echo 'cargo is not a symlink (or not on PATH)'
          echo '=== ls -la ~/.cargo/bin ==='
          ls -la ~/.cargo/bin/ 2>/dev/null || echo 'no ~/.cargo/bin yet'
          echo '=== stat inodes ==='
          stat -f '%i %p %N' ~/.cargo/bin/cargo ~/.cargo/bin/rustup ~/.cargo/bin/rustup-init 2>/dev/null || true
          echo '=== file types ==='
          file ~/.cargo/bin/cargo ~/.cargo/bin/rustup ~/.cargo/bin/rustup-init 2>/dev/null || true
          echo '=== rustup show ==='
          rustup show 2>&1 || echo 'rustup show failed'
          echo '=== cargo --version (proxy) ==='
          cargo --version 2>&1 || echo 'cargo --version failed'
          echo '=== PATH ==='
          echo "$PATH"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      # ───── Post-dtolnay diagnostic ─────
      - name: Diag — post-dtolnay state
        run: |
          set +e
          echo '=== ls -la ~/.cargo/bin ==='
          ls -la ~/.cargo/bin/
          echo '=== stat inodes ==='
          stat -f '%i %p %N' ~/.cargo/bin/cargo ~/.cargo/bin/rustup ~/.cargo/bin/rustup-init 2>/dev/null || true
          echo '=== file types ==='
          file ~/.cargo/bin/cargo ~/.cargo/bin/rustup ~/.cargo/bin/rustup-init 2>/dev/null || true
          echo '=== rustup show ==='
          rustup show 2>&1
          echo '=== rustup which cargo ==='
          rustup which cargo 2>&1 || echo 'rustup which cargo failed'
          echo '=== rustup which --toolchain ${{ matrix.toolchain }} cargo ==='
          rustup which --toolchain ${{ matrix.toolchain }} cargo 2>&1 || echo 'rustup which --toolchain failed'
          echo '=== cargo --version (proxy) ==='
          cargo --version 2>&1
          echo '=== rustup-init --version (direct) ==='
          ~/.cargo/bin/rustup-init --version 2>&1 || echo 'rustup-init binary not present at expected path'
          echo '=== ls -la ~/.rustup/toolchains ==='
          ls -la ~/.rustup/toolchains/ 2>/dev/null || echo 'no ~/.rustup/toolchains/'

      - uses: Swatinem/rust-cache@v2

      # ───── Post-cache diagnostic — the boundary right before the failure ─────
      - name: Diag — post-cache state (smoking-gun boundary)
        run: |
          set +e
          echo '=== ls -la ~/.cargo/bin ==='
          ls -la ~/.cargo/bin/
          echo '=== stat inodes (same inode = hardlink; differs = separate files; symlink = different beast) ==='
          stat -f '%i %p %N' ~/.cargo/bin/cargo ~/.cargo/bin/rustup ~/.cargo/bin/rustup-init 2>/dev/null || true
          echo '=== file types ==='
          file ~/.cargo/bin/cargo ~/.cargo/bin/rustup ~/.cargo/bin/rustup-init 2>/dev/null || true
          echo '=== readlink ==='
          for f in ~/.cargo/bin/cargo ~/.cargo/bin/rustup ~/.cargo/bin/rustup-init; do
            echo -n "$f -> "
            readlink "$f" 2>/dev/null || echo '(not a symlink)'
          done
          echo '=== cargo --version (this is what cargo test will hit) ==='
          cargo --version 2>&1
          echo '=== rustup show ==='
          rustup show 2>&1
          echo '=== env relevant to rustup/cargo ==='
          env | grep -E '^(RUSTUP|CARGO|RUST)' | sort

      - run: cargo test --workspace --no-fail-fast
