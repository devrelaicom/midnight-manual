name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  tracing-audit:
    name: tracing egress gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ripgrep is NOT pre-installed on the ubuntu-latest runner image.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: bash scripts/check-tracing-no-query.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.93.0", "stable"]
    env:
      # rust-toolchain.toml pins channel=1.93.0 for local dev; in CI we want
      # the matrix toolchain to win. RUSTUP_TOOLCHAIN overrides the file.
      # Without this, the rustup install path interacts poorly with
      # dtolnay/rust-toolchain on macOS-stable runners (intermittent
      # "unexpected argument 'test' found" rustup-init failures).
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove rust-toolchain.toml so the matrix toolchain wins
        run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # `cache-bin: false` — Swatinem/rust-cache@v2 defaults to caching
      # ~/.cargo/bin/, which on macos-latest includes the rustup proxy +
      # its symlink chain (cargo -> rustup -> /opt/homebrew/bin/rustup-init).
      # Cache save/restore intermittently lands a state where `cargo test`
      # dispatches to rustup-init setup_mode instead of the cargo proxy —
      # surfacing as `error: unexpected argument 'test' found`. Confirmed
      # via investigation branch (PR #19, 8 macOS runs with cache-bin: false,
      # 0 flakes). We don't `cargo install` anything in CI, so caching
      # ~/.cargo/bin gives no value.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo test --workspace --no-fail-fast

  # Slower leg: compiles all C grammar parse tables and runs mnm-content tests
  # with every gated language chunker (Go, Python, Solidity, Swift, Ruby,
  # Kotlin, C#, Haskell, Java, markup + vendored Scheme). The sibling `clippy`
  # job already covers all-grammars via --all-features, so no separate
  # clippy-all-grammars leg is needed here.
  test-all-grammars:
    name: test (all grammars)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo test -p mnm-content --features all-grammars

  integration:
    name: integration tests (with Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features integration --no-fail-fast

  # Commit-message linting runs locally via the committed `commit-msg` hook
  # (`.githooks/commit-msg`, enabled with `git config core.hooksPath .githooks`)
  # rather than as a CI gate.

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
