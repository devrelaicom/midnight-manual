name: Embedder smoke

# Loads the real `bge-base-en-v1.5` embedder and `bge-reranker-base`
# reranker and exercises them end-to-end (crates/mn-embedding/tests/
# real_embedder_smoke.rs). The tests are `#[ignore]`-gated so the main
# CI workflow does not download ~640 MB of ONNX weights on every lap.
#
# Runs daily at 04:00 UTC and can be triggered manually via the
# "Run workflow" button on the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  embedder-smoke:
    name: real-embedder smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      # Persist the fastembed ONNX bundles between runs so the daily lap
      # doesn't re-pull ~640 MB from Hugging Face every morning. The cache
      # key encodes the two model identifiers so any future model bump in
      # mn-embedding forces a clean re-download.
      - name: Cache fastembed model bundles
        uses: actions/cache@v4
        with:
          path: ~/.local/share/midnight-manual/models
          key: fastembed-bge-base-en-v1.5-bge-reranker-base-v1
          restore-keys: |
            fastembed-

      - name: Run real-embedder smoke tests
        run: |
          cargo test -p mn-embedding --test real_embedder_smoke \
            -- --ignored --nocapture
