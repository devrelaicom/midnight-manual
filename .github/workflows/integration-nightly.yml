name: Integration (nightly)

# Runs the full `--features integration` suite (boots Postgres + pgvector) on a
# daily schedule, independent of PR activity. The per-PR `integration` job in
# ci.yml already gates merges; this nightly run catches regressions in the
# integration suite even on days with no PRs (e.g. dependency drift, flaky
# external behavior) and gives a daily signal for work whose integration tests
# can only be exercised against a real database.
#
# Schedule is UTC (GitHub Actions cron is always UTC): 04:00 UTC daily.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  integration:
    name: integration tests (with Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features integration --no-fail-fast
