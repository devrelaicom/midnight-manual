[workspace]
members = [
    "crates/mnm-core",
    "crates/mnm-store",
    "crates/mnm-retrieval",
    "crates/mnm-content",
    "crates/mnm-embedding",
    "crates/mnm-auth",
    "crates/mnm-telemetry",
    "crates/mnm-skills",
    "crates/mnm-mcp",
    "crates/midnight-manual",
    "crates/midnight-manual-server",
]
resolver = "2"

[workspace.package]
version       = "0.2.0"
edition       = "2021"
rust-version  = "1.91"
license       = "Apache-2.0 OR MIT"
authors       = ["Midnight Network Contributors"]
repository    = "https://github.com/devrelaicom/midnight-manual"
homepage      = "https://midnight.network"
description   = "RAG platform for the Midnight Network: CLI, local MCP server, and cloud read API."

[workspace.lints.rust]
# `deny` (not `forbid`) so the single FFI binding to the vendored tree-sitter
# Scheme grammar in mnm-content can opt in with a narrowly-scoped
# `#[allow(unsafe_code)]`. Unsafe remains denied everywhere by default; only that
# one documented FFI declaration is permitted. `forbid` would make even that
# scoped allow a hard error.
unsafe_code     = "deny"
missing_docs    = "warn"
unused_imports  = "warn"

# cargo-dist config lives in dist-workspace.toml (cargo-dist 0.32.0). The
# back-end workflow `.github/workflows/release.yml` is hand-authored.

[workspace.lints.clippy]
all              = { level = "warn", priority = -1 }
pedantic         = { level = "warn", priority = -1 }
nursery          = { level = "warn", priority = -1 }
# Curated exceptions — adjust as the codebase grows.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"

# Shared dependency versions. Crates declare deps with `version.workspace = true`.
[workspace.dependencies]
# Internal crates — path for local builds, version so `cargo publish` accepts the
# dependency on crates.io. release-plz keeps these versions in sync on each bump.
mnm-core        = { path = "crates/mnm-core", version = "0.2.0" }
mnm-store       = { path = "crates/mnm-store", version = "0.2.0" }
mnm-retrieval   = { path = "crates/mnm-retrieval", version = "0.2.0" }
mnm-content     = { path = "crates/mnm-content", version = "0.2.0" }
mnm-embedding   = { path = "crates/mnm-embedding", version = "0.2.0" }
mnm-auth        = { path = "crates/mnm-auth", version = "0.2.0" }
mnm-telemetry   = { path = "crates/mnm-telemetry", version = "0.2.0" }
mnm-skills      = { path = "crates/mnm-skills", version = "0.2.0" }
mnm-mcp         = { path = "crates/mnm-mcp", version = "0.2.0" }
midnight-manual = { path = "crates/midnight-manual", version = "0.2.0" }

# Async runtime + HTTP
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-std"] }
axum             = "0.7"
tower            = "0.5"
tower-http       = { version = "0.6", features = ["cors", "limit", "trace", "set-header"] }
hyper            = "1"
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Storage
sqlx             = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "time", "json", "migrate"] }
pgvector         = { version = "0.4", features = ["sqlx", "postgres"] }

# Serialization & schemas
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
serde_yaml       = "0.9"
toml             = "0.8"
jsonschema       = "0.18"
schemars         = "0.8"
utoipa           = { version = "5", features = ["axum_extras", "uuid", "time"] }

# CLI & config
clap             = { version = "4", features = ["derive", "env"] }
directories      = "5"
globset          = "0.4"

# Auth & crypto
ed25519-dalek    = { version = "2", features = ["rand_core", "pkcs8"] }
jsonwebtoken     = "9"
oauth2           = "5"
octocrab         = "0.50"
sha2             = "0.10"
base64           = "0.22"

# Content processing
pulldown-cmark   = "0.12"
quick-xml        = "0.31"
# Compact parser frontend (rowan-based, pure Rust — no native build step).
# Optional + feature-gated in mnm-content. Exact pin: pre-release (beta) API.
compactp_parser = "=0.1.0-beta.1"
compactp_ast    = "=0.1.0-beta.1"
compactp_syntax = "=0.1.0-beta.1"
# tree-sitter runtime is pinned to 0.25 (selects 0.25.10). This is the version
# text-splitter 0.27 requires (`^0.25`) AND the newest line whose `tokenizers`
# transitive dep still resolves to 0.21 (text-splitter 0.28+ bumped to
# tokenizers 0.22, which would clash with the load-bearing workspace
# tokenizers 0.21). Every grammar below resolves its ABI through
# `tree-sitter-language ^0.1` (their direct `tree-sitter` req is dev-only), so
# they unify against this runtime. See build verification in commit message.
tree-sitter      = "0.25"     # selects 0.25.10
# ABI shim for FFI grammar bindings (LanguageFn). Already in the graph via every
# grammar crate; declared directly here for the vendored Scheme grammar.
tree-sitter-language = "0.1"  # selects 0.1.7
# text-splitter: code+tokenizers features. Pinned to 0.27 (last release on the
# tokenizers-0.21 line; 0.28+ requires tokenizers 0.22 which cannot unify with
# the workspace tokenizers 0.21 that tokens.rs depends on).
text-splitter    = { version = "0.27", features = ["code", "tokenizers"] }
# Directory walker honoring .gitignore (used by the code ingest walker).
ignore           = "0.4"
# tree-sitter grammars. All are optional + feature-gated in mnm-content. Each
# depends on tree-sitter-language ^0.1 for ABI, unifying against runtime 0.25.
tree-sitter-rust       = "0.24"   # selects 0.24.2
tree-sitter-typescript = "0.23"   # selects 0.23.2
tree-sitter-javascript = "0.25"   # selects 0.25.0
tree-sitter-bash       = "0.25"   # selects 0.25.1
tree-sitter-go         = "0.25"   # selects 0.25.0
tree-sitter-python     = "0.25"   # selects 0.25.0
tree-sitter-solidity   = "1.2"    # JoranHonig canonical; selects 1.2.13
tree-sitter-toml-ng    = "0.7"    # tree-sitter-grammars fork (crate is *-ng)
tree-sitter-yaml       = "0.7"    # tree-sitter-grammars fork; selects 0.7.2
tree-sitter-html       = "0.23"   # selects 0.23.2
tree-sitter-xml        = "0.7"    # selects 0.7.0
tree-sitter-swift      = "0.7"    # selects 0.7.2
tree-sitter-ruby       = "0.23"   # selects 0.23.1
tree-sitter-kotlin-ng  = "1.1"    # fwcd *-ng fork; selects 1.1.0
tree-sitter-c-sharp    = "0.23"   # selects 0.23.5
tree-sitter-haskell    = "0.23"   # selects 0.23.1
tree-sitter-java       = "0.23"   # selects 0.23.5

# ML
# A direct workspace dep so mnm-content can compute real BPE token counts that
# match the production embedder, without dragging in any model runtime.
# default-features disabled to drop the `progressbar` (indicatif) and `onig`
# (Oniguruma C lib) baggage we do not need for offline encode-only usage.
tokenizers       = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Observability
tracing                    = "0.1"
tracing-subscriber         = { version = "0.3", features = ["env-filter", "json"] }
metrics                    = "0.23"
metrics-exporter-prometheus = "0.15"

# Utilities
anyhow           = "1"
thiserror        = "2"
uuid             = { version = "1", features = ["v4", "serde"] }
time             = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
url              = "2"
ipnet            = "2"
regex            = "1"
semver           = "1"
once_cell        = "1"
indicatif        = "0.17"
# Build-dep: compiles the vendored Scheme parser.c (build.rs lands in Task 16).
# Declaring it now is harmless — Cargo only runs build.rs if the file exists.
cc               = "1"

# Testing
proptest         = "1"
testcontainers   = "0.23"
insta            = "1"
tempfile         = "3"
walkdir          = "2"
wiremock         = "0.6"

# CLI command convenience for the workspace itself
# (not a runtime dep; surfaced for documentation only)

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# cargo-dist builds release artifacts with `--profile dist`. Inherit our tuned
# release profile so prebuilt binaries match a normal release build.
[profile.dist]
inherits = "release"

[profile.dev]
opt-level = 0
debug     = true

# Compile sqlx queries fast in dev
[profile.dev.package.sqlx-macros]
opt-level = 3
