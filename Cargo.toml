[workspace]
members = [
    "crates/mn-core",
    "crates/mn-store",
    "crates/mn-retrieval",
    "crates/mn-content",
    "crates/mn-embedding",
    "crates/mn-auth",
    "crates/mn-telemetry",
    "crates/mn-mcp",
    "crates/mn-cli",
    "crates/mn-server",
]
resolver = "2"

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.91"
license       = "Apache-2.0"
authors       = ["Midnight Network Contributors"]
repository    = "https://github.com/midnight-network/midnight-manual"
homepage      = "https://midnight.network"
description   = "RAG platform for the Midnight Network: CLI, local MCP server, and cloud read API."

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"
unused_imports  = "warn"

# cargo-dist (a.k.a. `dist`) — release-artifact build matrix wired into
# `.github/workflows/release.yml`. The runtime cargo-dist version is whatever
# the installer script pulls; this `cargo-dist-version` field is a reminder of
# which tool version generated this config. Re-run `cargo dist init` to refresh
# the schema if a newer cargo-dist warns about it.
[workspace.metadata.dist]
cargo-dist-version = "0.27.1"
ci                 = ["github"]
installers         = ["shell", "powershell"]
# Seven targets per FR-099 (CLI binary distribution). The server is Docker-only
# (see crates/mn-server/Cargo.toml `[package.metadata.dist] dist = false`), so
# this matrix only builds the `midnight-manual` + `mnm` CLI binaries.
targets            = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# The release.yml workflow opens a PR-style draft on tag pushes, so cargo-dist
# should plan rather than build on PRs.
pr-run-mode        = "plan"
# Release tag fires under release-please; allow uncommitted changes the action
# creates in CI checkouts.
allow-dirty        = ["ci"]

[workspace.lints.clippy]
all              = { level = "warn", priority = -1 }
pedantic         = { level = "warn", priority = -1 }
nursery          = { level = "warn", priority = -1 }
# Curated exceptions — adjust as the codebase grows.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"

# Shared dependency versions. Crates declare deps with `version.workspace = true`.
[workspace.dependencies]
# Async runtime + HTTP
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-std"] }
axum             = "0.7"
tower            = "0.5"
tower-http       = { version = "0.6", features = ["cors", "limit", "trace", "set-header"] }
hyper            = "1"
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Storage
sqlx             = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "time", "json", "migrate"] }
pgvector         = { version = "0.4", features = ["sqlx", "postgres"] }

# Serialization & schemas
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
serde_yaml       = "0.9"
toml             = "0.8"
jsonschema       = "0.18"
schemars         = "0.8"
utoipa           = { version = "5", features = ["axum_extras", "uuid", "time"] }

# CLI & config
clap             = { version = "4", features = ["derive", "env"] }
directories      = "5"
globset          = "0.4"

# Auth & crypto
ed25519-dalek    = { version = "2", features = ["rand_core", "pkcs8"] }
jsonwebtoken     = "9"
oauth2           = "5"
octocrab         = "0.50"
sha2             = "0.10"
base64           = "0.22"

# Content processing
pulldown-cmark   = "0.12"
quick-xml        = "0.31"
# tree-sitter runtime is pinned to 0.25 (selects 0.25.10). This is the version
# text-splitter 0.27 requires (`^0.25`) AND the newest line whose `tokenizers`
# transitive dep still resolves to 0.21 (text-splitter 0.28+ bumped to
# tokenizers 0.22, which would clash with the load-bearing workspace
# tokenizers 0.21). Every grammar below resolves its ABI through
# `tree-sitter-language ^0.1` (their direct `tree-sitter` req is dev-only), so
# they unify against this runtime. See build verification in commit message.
tree-sitter      = "0.25"     # selects 0.25.10
# text-splitter: code+tokenizers features. Pinned to 0.27 (last release on the
# tokenizers-0.21 line; 0.28+ requires tokenizers 0.22 which cannot unify with
# the workspace tokenizers 0.21 that fastembed + tokens.rs depend on).
text-splitter    = { version = "0.27", features = ["code", "tokenizers"] }
# Directory walker honoring .gitignore (used by the code ingest walker).
ignore           = "0.4"
# tree-sitter grammars. All are optional + feature-gated in mn-content. Each
# depends on tree-sitter-language ^0.1 for ABI, unifying against runtime 0.25.
tree-sitter-rust       = "0.24"   # selects 0.24.2
tree-sitter-typescript = "0.23"   # selects 0.23.2
tree-sitter-javascript = "0.25"   # selects 0.25.0
tree-sitter-bash       = "0.25"   # selects 0.25.1
tree-sitter-go         = "0.25"   # selects 0.25.0
tree-sitter-python     = "0.25"   # selects 0.25.0
tree-sitter-solidity   = "1.2"    # JoranHonig canonical; selects 1.2.13
tree-sitter-toml-ng    = "0.7"    # tree-sitter-grammars fork (crate is *-ng)
tree-sitter-yaml       = "0.7"    # tree-sitter-grammars fork; selects 0.7.2
tree-sitter-html       = "0.23"   # selects 0.23.2
tree-sitter-xml        = "0.7"    # selects 0.7.0
tree-sitter-swift      = "0.7"    # selects 0.7.2
tree-sitter-ruby       = "0.23"   # selects 0.23.1
tree-sitter-kotlin-ng  = "1.1"    # fwcd *-ng fork; selects 1.1.0
tree-sitter-c-sharp    = "0.23"   # selects 0.23.5
tree-sitter-haskell    = "0.23"   # selects 0.23.1
tree-sitter-java       = "0.23"   # selects 0.23.5

# ML
fastembed        = "4"
# tokenizers is already a transitive dep of fastembed; we promote it to a
# direct workspace dep so mn-content can compute real BPE token counts
# without dragging in the embedder. default-features disabled to drop the
# `progressbar` (indicatif) and `onig` (Oniguruma C lib) baggage we do not
# need for offline encode-only usage.
tokenizers       = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Observability
tracing                    = "0.1"
tracing-subscriber         = { version = "0.3", features = ["env-filter", "json"] }
metrics                    = "0.23"
metrics-exporter-prometheus = "0.15"

# Utilities
anyhow           = "1"
thiserror        = "2"
uuid             = { version = "1", features = ["v4", "serde"] }
time             = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
url              = "2"
ipnet            = "2"
regex            = "1"
semver           = "1"
once_cell        = "1"
indicatif        = "0.17"
# Build-dep: compiles the vendored Scheme parser.c (build.rs lands in Task 16).
# Declaring it now is harmless — Cargo only runs build.rs if the file exists.
cc               = "1"

# Testing
proptest         = "1"
testcontainers   = "0.23"
insta            = "1"
tempfile         = "3"
walkdir          = "2"
wiremock         = "0.6"

# CLI command convenience for the workspace itself
# (not a runtime dep; surfaced for documentation only)

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = true

# Compile sqlx queries fast in dev
[profile.dev.package.sqlx-macros]
opt-level = 3
