[workspace]
members = [
    "crates/mn-core",
    "crates/mn-store",
    "crates/mn-retrieval",
    "crates/mn-content",
    "crates/mn-embedding",
    "crates/mn-auth",
    "crates/mn-telemetry",
    "crates/mn-mcp",
    "crates/mn-cli",
    "crates/mn-server",
]
resolver = "2"

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.91"
license       = "Apache-2.0"
authors       = ["Midnight Network Contributors"]
repository    = "https://github.com/midnight-network/midnight-manual"
homepage      = "https://midnight.network"
description   = "RAG platform for the Midnight Network: CLI, local MCP server, and cloud read API."

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"
unused_imports  = "warn"

[workspace.lints.clippy]
all              = { level = "warn", priority = -1 }
pedantic         = { level = "warn", priority = -1 }
nursery          = { level = "warn", priority = -1 }
# Curated exceptions — adjust as the codebase grows.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
must_use_candidate      = "allow"

# Shared dependency versions. Crates declare deps with `version.workspace = true`.
[workspace.dependencies]
# Async runtime + HTTP
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-std"] }
axum             = "0.7"
tower            = "0.5"
tower-http       = { version = "0.6", features = ["cors", "limit", "trace", "set-header"] }
hyper            = "1"

# Storage
sqlx             = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "time", "json"] }
pgvector         = { version = "0.4", features = ["sqlx", "postgres"] }

# Serialization & schemas
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
serde_yaml       = "0.9"
toml             = "0.8"
jsonschema       = "0.18"
schemars         = "0.8"
utoipa           = { version = "5", features = ["axum_extras", "uuid", "time"] }

# CLI & config
clap             = { version = "4", features = ["derive", "env"] }
directories      = "5"

# Auth & crypto
ed25519-dalek    = { version = "2", features = ["rand_core", "pkcs8"] }
jsonwebtoken     = "9"
oauth2           = "5"
octocrab         = "0.50"
sha2             = "0.10"
base64           = "0.22"

# Content processing
pulldown-cmark   = "0.12"
tree-sitter      = "0.23"
tree-sitter-rust       = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

# ML
fastembed        = "4"

# Observability
tracing                    = "0.1"
tracing-subscriber         = { version = "0.3", features = ["env-filter", "json"] }
metrics                    = "0.23"
metrics-exporter-prometheus = "0.15"

# Utilities
anyhow           = "1"
thiserror        = "2"
uuid             = { version = "1", features = ["v4", "serde"] }
time             = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
url              = "2"
ipnet            = "2"
regex            = "1"
once_cell        = "1"
indicatif        = "0.17"

# Testing
proptest         = "1"
testcontainers   = "0.23"
insta            = "1"
tempfile         = "3"

# CLI command convenience for the workspace itself
# (not a runtime dep; surfaced for documentation only)

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
opt-level = 0
debug     = true

# Compile sqlx queries fast in dev
[profile.dev.package.sqlx-macros]
opt-level = 3
