[package]
name = "midnight-manual-server"
description = "midnight-manual cloud server binary (Fly.io deployment target)."

version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }

[lints]
workspace = true

[features]
integration = []

# Excluded from cargo-dist (FR-102): the server is published as a multi-arch
# Docker image (Dockerfile.server), not as a per-OS binary archive. The CLI
# crate (midnight-manual) is the only artifact cargo-dist ships.
[package.metadata.dist]
dist = false

[[bin]]
name = "midnight-manual-server"
path = "src/main.rs"

[dev-dependencies]
testcontainers = { workspace = true }
tower          = { workspace = true }
wiremock       = { workspace = true }
serde_json     = { workspace = true }
toml           = { workspace = true }
# Used only by tests/f_bug_e2e.rs to drive the real CLI ingest path against
# a live midnight-manual-server backed by testcontainers Postgres.
midnight-manual         = { workspace = true }
tempfile       = { workspace = true }

[dependencies]
mnm-core        = { workspace = true }
mnm-auth        = { workspace = true }
mnm-store       = { workspace = true }
mnm-retrieval   = { workspace = true }
mnm-telemetry   = { workspace = true }
mnm-embedding   = { workspace = true }
mnm-sentry      = { workspace = true }
sentry          = { workspace = true }
axum           = { workspace = true }
tokio          = { workspace = true }
tower          = { workspace = true }
tower-http     = { workspace = true }
hyper          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sqlx           = { workspace = true }
pgvector       = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa         = { workspace = true }
anyhow         = { workspace = true }
thiserror      = { workspace = true }
uuid           = { workspace = true }
time           = { workspace = true }
ipnet          = { workspace = true }
url            = { workspace = true }
base64         = { workspace = true }
reqwest        = { workspace = true }
