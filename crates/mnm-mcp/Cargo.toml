[package]
name = "mnm-mcp"
description = "MCP JSON-RPC server over stdio and Streamable HTTP: thirteen tools plus the add_midnight_skills prompt."

version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }

[lints]
workspace = true

[features]
integration = []

[dependencies]
axum          = { workspace = true }
tower-http    = { workspace = true }
mnm-core       = { workspace = true }
mnm-embedding  = { workspace = true }
mnm-retrieval  = { workspace = true }
mnm-skills     = { workspace = true }
mnm-telemetry  = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
tokio         = { workspace = true }
once_cell     = { workspace = true }
reqwest       = { workspace = true }
sentry        = { workspace = true }
url           = { workspace = true }
uuid          = { workspace = true }

[dev-dependencies]
jsonschema    = { workspace = true }
wiremock      = { workspace = true }
tempfile      = { workspace = true }
# `util` is additive over the featureless workspace line: it carries
# `ServiceExt::oneshot`, which the HTTP-transport tests use to drive the axum
# `Router` in-process (no sockets — the test sandbox kills local-network tests).
tower         = { workspace = true, features = ["util"] }
