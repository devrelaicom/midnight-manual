[package]
name = "mn-embedding"
description = "VoyageAI embedding client plus the fastembed-rs bge-reranker-base cross-encoder."

version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }

[lints]
workspace = true

[features]
integration = []
# Reserved for opt-in model-load tests. The reranker smoke test is `#[ignore]`-
# gated (see tests/real_reranker_smoke.rs) rather than feature-gated, so nothing
# references this today; kept as a stable knob for future model-load gating.
models = []

[dependencies]
mn-core      = { path = "../mn-core" }
fastembed    = { workspace = true }
once_cell    = { workspace = true }
sha2         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tokio        = { workspace = true }
reqwest      = { workspace = true }

[dev-dependencies]
wiremock     = { workspace = true }
