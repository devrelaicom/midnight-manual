[package]
name = "mnm-retrieval"
description = "Hybrid (FTS + vector) retrieval, RRF merging, and trust × relevance scoring."

version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }

[lints]
workspace = true

[features]
integration = []

[dependencies]
mnm-core      = { workspace = true }
mnm-store     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
semver       = { workspace = true }
# `serde-human-readable` makes `time::Date` (de)serialize as ISO `YYYY-MM-DD`
# strings rather than the default `(year, ordinal)` tuple — required so the
# `ingested_at` / `source_modified_at` facet ranges round-trip the JSON dates
# clients send. Layered on top of the workspace `time` feature set.
time         = { workspace = true, features = ["serde-human-readable"] }

[dev-dependencies]
proptest = { workspace = true }
