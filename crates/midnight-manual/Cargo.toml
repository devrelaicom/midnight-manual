[package]
name = "midnight-manual"
description = "midnight-manual CLI binary (also installed as `mnm`); exposes `mcp serve` subcommand."

version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }

[lints]
workspace = true

[features]
integration = []
default = ["compact"]
# Compact chunking (default-on). Exclude with `--no-default-features`.
compact = ["mnm-content/compact"]

# Two binary names from one crate, per D16 / Story 10. Cargo dislikes pointing two
# bin targets at the same file, so `mnm` is a thin shim in src/bin/mnm.rs that defers
# to `midnight_manual::run()` once the CLI lib is added; for now both stubs
# print a placeholder message.
[[bin]]
name = "midnight-manual"
path = "src/main.rs"

[[bin]]
name = "mnm"
path = "src/bin/mnm.rs"

[dependencies]
mnm-core       = { workspace = true }
mnm-auth       = { workspace = true }
mnm-content    = { workspace = true, default-features = false, features = ["core-grammars"] }
mnm-embedding  = { workspace = true }
mnm-mcp        = { workspace = true }
mnm-retrieval  = { workspace = true }
mnm-skills     = { workspace = true }
mnm-telemetry  = { workspace = true }
clap          = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
toml          = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
directories   = { workspace = true }
anyhow        = { workspace = true }
indicatif     = { workspace = true }
uuid          = { workspace = true }
reqwest       = { workspace = true }
time          = { workspace = true }
base64        = { workspace = true }
url           = { workspace = true }
tempfile      = { workspace = true }

[dev-dependencies]
wiremock      = { workspace = true }
ed25519-dalek = { workspace = true }
mnm-telemetry  = { workspace = true }
