[build]
  base    = "site"
  command = "pnpm build"
  publish = "build"

[build.environment]
  NODE_VERSION = "26.3.1"

[[headers]]
  for = "/**/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
