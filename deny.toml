# cargo-deny policy — license allowlist + advisory gate, run in release.yml's gate.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[advisories]
yanked = "deny"
# Add specific RUSTSEC IDs here only with a justifying comment.
ignore = []

[bans]
# midnight-manual has a large transitive graph (tree-sitter grammars, sqlx, etc.)
# with legitimate duplicate versions; do not fail the build on duplicates.
multiple-versions = "allow"
