# cargo-deny policy — license allowlist + advisory gate, run in release.yml's gate.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[advisories]
yanked = "deny"
# Mirrors .cargo/audit.toml (the cargo-audit gate) so both gates agree. Each entry
# is a vetted advisory with no safe upgrade; see .cargo/audit.toml for the full
# dependency-path + exposure justification. Revisit every release.
ignore = [
    # rsa Marvin timing sidechannel — reached only via octocrab GitHub-App auth,
    # which we don't use (OAuth web/device flow instead). No upstream fix.
    "RUSTSEC-2023-0071",
    # tokio-tar PAX-header file smuggling — dev-dependency only (testcontainers ->
    # bollard), never in a release build; we only launch known images.
    "RUSTSEC-2025-0111",
    # paste — unmaintained declarative-macro lib (via metrics + utoipa-gen); no exploit.
    "RUSTSEC-2024-0436",
    # number_prefix — unmaintained, transitively via indicatif; no exploit.
    "RUSTSEC-2025-0119",
    # rustls-pemfile — unmaintained (via bollard/testcontainers + rustls-native-certs);
    # upstream migrating to rustls-pki-types.
    "RUSTSEC-2025-0134",
]

[bans]
# midnight-manual has a large transitive graph (tree-sitter grammars, sqlx, etc.)
# with legitimate duplicate versions; do not fail the build on duplicates.
multiple-versions = "allow"
