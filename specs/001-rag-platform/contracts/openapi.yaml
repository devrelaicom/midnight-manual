openapi: 3.1.0
info:
  title: midnight-manual cloud API
  version: 1.0.0
  description: |
    HTTP API for the midnight-manual cloud server. Implements Stories 4 (read API),
    9 (auth + write API + admin), 11 (telemetry + metrics) from `specs/001-rag-platform/spec.md`.

    Every response carries `X-Request-Id`. Every 4xx/5xx uses the typed error envelope
    (see `Error`).

servers:
  - url: https://manual.midnight.network/v1
    description: Production

paths:
  # ===== Read API (Story 4) =====
  /search:
    post:
      operationId: search
      summary: Hybrid search (FTS + vector + RRF; optional reranking client-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409': { $ref: '#/components/responses/EmbeddingModelMismatch' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/QueryTimeout' }

  /sources:
    get:
      operationId: listSources
      summary: List sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Source' }
    post:
      operationId: createSource
      summary: Create a source (admin)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSource
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSource
      summary: Update source metadata (admin)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSourceRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}/retire:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retireSource
      summary: Retire an entire source (admin)
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}/versions:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listSourceVersions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceVersion' }

  /sources/{slug}/versions/{revision}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: revision
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getSourceVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /sources/{slug}/versions/{revision}/promote:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: revision
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: promoteSourceVersion
      summary: Promote a historical version to active (admin; rollback)
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}/versions/{revision}/retire:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: revision
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: retireSourceVersion
      summary: Retire a specific historical version (admin)
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK

  # ===== Ingest write protocol (Story 9) =====
  /sources/{slug}/ingest-runs:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: startIngestRun
      summary: Allocate a new source_version in 'building' state (admin)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartIngestRunRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartIngestRunResponse' }

  /sources/{slug}/ingest-runs/{id}/documents:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: uploadDocuments
      summary: Batch upload documents+chunks (idempotent on content hashes)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadDocumentsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadDocumentsResponse' }
        '409':
          description: Run aborted or finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sources/{slug}/ingest-runs/{id}/finalize:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: finalizeIngestRun
      summary: Atomically flip the new source_version to active
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizeResult' }

  /sources/{slug}/ingest-runs/{id}/abort:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: abortIngestRun
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK

  # ===== Chunks and traversal (Story 4) =====
  /chunks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getChunk
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chunks/{id}/siblings:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getChunkSiblings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChunkResult' }

  /chunks/{id}/parents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getChunkParents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Node' }

  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDocument
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }

  /documents/{id}/chunks:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDocumentChunks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChunkResult' }

  /nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getNode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }

  /nodes/{id}/children:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getNodeChildren
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Node' }

  /models/active:
    get:
      operationId: getActiveEmbeddingModel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingModel' }

  # ===== Auth (Story 9) =====
  /auth/challenge:
    post:
      operationId: authChallenge
      summary: Begin Ed25519 challenge-response (D10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
              required: [user_id]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce: { type: string }
                  expires_at: { type: string, format: date-time }
                required: [nonce, expires_at]

  /auth/verify:
    post:
      operationId: authVerify
      summary: Complete challenge-response and mint admin JWT (D21)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                nonce: { type: string }
                signature: { type: string, description: "base64-encoded Ed25519 signature" }
              required: [user_id, nonce, signature]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt: { type: string }
                  expires_at: { type: string, format: date-time }
                required: [jwt, expires_at]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/github/start:
    get:
      operationId: authGithubStart
      summary: Begin GitHub OAuth flow (FR-115)
      responses:
        '302':
          description: Redirect to GitHub
          headers:
            Location:
              schema: { type: string }

  /auth/github/callback:
    get:
      operationId: authGithubCallback
      summary: Exchange GitHub code for read-uplift bearer (FR-117)
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bearer_token: { type: string }
                  expires_at: { type: string, format: date-time }
                  github_login: { type: string }
                required: [bearer_token, expires_at, github_login]
        '403':
          description: User not a member of the configured Midnight org
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ===== Admin (Story 9) =====
  /admin/ratelimits:
    get:
      operationId: listRateLimitOverrides
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RateLimitOverride' }
    post:
      operationId: createRateLimitOverride
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRateLimitOverrideRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitOverride' }

  /admin/ratelimits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: extendRateLimitOverride
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at: { type: string, format: date-time }
              required: [expires_at]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitOverride' }
    delete:
      operationId: deleteRateLimitOverride
      security:
        - adminJwt: []
      responses:
        '204':
          description: No Content

  # ===== Telemetry & ops (Story 11) =====
  /telemetry:
    post:
      operationId: postTelemetry
      summary: Submit a batch of telemetry events (D27, FR-116; anonymous, dedicated rate-limit bucket)
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: NDJSON; one TelemetryEvent per line.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryRejection' }

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus exposition (FR-111)
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: Process is alive

  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Ready (DB reachable, user store loaded, model registry seeded)
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT minted via Ed25519 challenge-response (D21)
    readUplift:
      type: http
      scheme: bearer
      description: GitHub-SSO-minted read-uplift bearer (D11/FR-117)

  schemas:
    # ===== Errors =====
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, remediation]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - embedding_model_mismatch
                - run_aborted
                - run_already_finalized
                - nonce_consumed
                - nonce_expired
                - gone
                - payload_too_large
                - rate_limited
                - service_unavailable
                - query_timeout
                - schema_missing
                - unsupported_field
                - internal
            message: { type: string }
            remediation: { type: string }
            context: { type: object, additionalProperties: true }
        request_id: { type: string }

    # ===== Core entities =====
    Source:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [docs_site, code_repo, standalone, mixed] }
        origin_url: { type: string, nullable: true }
        retention_count: { type: integer, minimum: 1, maximum: 50 }
        created_at: { type: string, format: date-time }
        retired_at: { type: string, format: date-time, nullable: true }

    SourceVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        revision: { type: integer }
        status: { type: string, enum: [building, active, inactive, aborted, retired] }
        is_active: { type: boolean }
        ingested_at: { type: string, format: date-time }
        ingest_cli_version: { type: string }
        embedding_model: { $ref: '#/components/schemas/EmbeddingModel' }
        content_hash: { type: string }
        notes: { type: string, nullable: true }
        retired_at: { type: string, format: date-time, nullable: true }

    EmbeddingModel:
      type: object
      properties:
        name: { type: string }
        revision: { type: integer }
        dim: { type: integer }
        provider: { type: string }
        wire: { type: string, description: "{name}@{revision} wire form" }

    Node:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_node_id: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [root, group, document, chunk] }
        name: { type: string }
        order_index: { type: integer }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [markdown, code, plaintext] }
        source_url: { type: string, nullable: true }
        published_url: { type: string, nullable: true }
        source_path: { type: string }
        language: { type: string, nullable: true }
        frontmatter: { type: object, nullable: true, additionalProperties: true }
        provenance: { $ref: '#/components/schemas/Provenance' }
        package: { $ref: '#/components/schemas/Package', nullable: true }

    Package:
      type: object
      properties:
        kind: { type: string, enum: [rust, npm, compact, other] }
        name: { type: string }
        version: { type: string, nullable: true }
        manifest_path: { type: string, nullable: true }

    Provenance:
      type: object
      properties:
        attribution: { type: string, enum: [foundation, partner, third_party, community, unknown] }
        verified: { type: boolean }
        verified_by: { type: string, nullable: true }
        verified_at: { type: string, format: date, nullable: true }
        verification_notes: { type: string, nullable: true }
        language_targets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              version_constraint: { type: string }
        sdk_dependencies:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [npm, cargo, compact] }
              name: { type: string }
              version_constraint: { type: string }
        deprecation:
          type: object
          properties:
            is_deprecated: { type: boolean }
            since: { type: string, format: date, nullable: true }
            reason: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        content_type: { type: string, enum: [doc, tutorial, reference, example, contract_source, sdk_source, test, readme] }

    Chunk:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        chunk_index: { type: integer }
        total_chunks: { type: integer }
        heading_path: { type: array, items: { type: string } }
        symbol_path: { type: array, items: { type: string } }
        start_byte: { type: integer }
        end_byte: { type: integer }
        token_count: { type: integer }
        status: { type: string, enum: [ready, embed_failed, deprecated] }

    # ===== Search =====
    SearchRequest:
      type: object
      required: [client_embedding_model]
      description: >-
        Provide EITHER `queries` (canonical multi-query form) OR the single-query
        convenience pair `query` + `vector`. The two are mutually exclusive; the
        convenience form behaves identically to a one-element `queries` array.
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [text, vector]
            properties:
              text: { type: string, minLength: 1 }
              vector:
                type: array
                items: { type: number }
                minItems: 768
                maxItems: 768
        query:
          type: string
          minLength: 1
          description: Single-query convenience form text (pairs with `vector`; mutually exclusive with `queries`).
        vector:
          type: array
          items: { type: number }
          minItems: 768
          maxItems: 768
          description: Single-query convenience form embedding (pairs with `query`).
        client_embedding_model: { type: string, description: "{name}@{revision} per FR-039" }
        limit: { type: integer, default: 20, minimum: 1, maximum: 100 }
        sort_by: { type: string, enum: [confidence, trust, relevance, score], default: confidence }
        min_confidence: { type: number, default: 0.0, minimum: 0.0, maximum: 1.0 }
        filters: { $ref: '#/components/schemas/SearchFilters' }
        include_scores: { type: boolean, default: true }

    SearchFilters:
      type: object
      additionalProperties: false
      properties:
        source_slug:
          type: array
          items: { type: string }
        attribution:
          type: array
          items: { type: string }
        verified: { type: boolean }
        content_type:
          type: array
          items: { type: string }
        language_target:
          type: object
          properties:
            name: { type: string }
            version_constraint_satisfies: { type: string }
        sdk_dependency:
          type: array
          description: OR within the array; each entry matches by kind + name, optionally refined by a server-side semver check (FR-033).
          items:
            type: object
            properties:
              kind: { type: string }
              name: { type: string }
              version_constraint_satisfies: { type: string }
        package:
          type: array
          description: OR within the array; each entry matches a chunk's document package by kind + name.
          items:
            type: object
            properties:
              kind: { type: string }
              name: { type: string }

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ChunkResult' }
        corpus_embedding_model: { type: string, description: "{name}@{revision}" }
        search_metadata:
          type: object
          properties:
            took_ms: { type: integer }
            returned: { type: integer }
            filtered_by_confidence: { type: integer }
            sort_by: { type: string }
            deduplicated_count: { type: integer }
            per_query:
              type: array
              items:
                type: object
                properties:
                  query_index: { type: integer }
                  fts_candidates: { type: integer }
                  vector_candidates: { type: integer }
                  fts_latency_ms: { type: integer }
                  vector_latency_ms: { type: integer }
            fts_zero_matches: { type: boolean }
            limit_capped: { type: boolean }

    ChunkResult:
      type: object
      properties:
        chunk: { $ref: '#/components/schemas/Chunk' }
        document: { $ref: '#/components/schemas/Document' }
        source: { $ref: '#/components/schemas/Source' }
        source_version: { $ref: '#/components/schemas/SourceVersion' }
        package: { $ref: '#/components/schemas/Package', nullable: true }
        parent_chain:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        navigation:
          type: object
          properties:
            prev_chunk_id: { type: string, format: uuid, nullable: true }
            next_chunk_id: { type: string, format: uuid, nullable: true }
        scores:
          type: object
          description: >-
            Per-result scores. Omitted entirely when the request sets
            include_scores=false. trust_score, confidence, and
            confidence_factors are the US6 (D24) additive fields.
          properties:
            rrf_score: { type: number }
            vector_similarity: { type: number }
            matched_queries:
              type: array
              items: { type: integer }
            trust_score: { type: number, minimum: 0, maximum: 1 }
            confidence: { type: number, minimum: 0, maximum: 1 }
            confidence_factors: { $ref: '#/components/schemas/ConfidenceFactors' }

    ConfidenceFactors:
      type: object
      properties:
        attribution: { type: string }
        attribution_multiplier: { type: number }
        verified: { type: boolean }
        verified_by: { type: string, nullable: true }
        verification_multiplier: { type: number }
        age_days: { type: integer }
        freshness_multiplier: { type: number }
        deprecation: { type: boolean }
        deprecation_multiplier: { type: number }
        language_target_query: { type: object, nullable: true }
        language_targets_chunk: { type: array, items: { type: object } }
        version_match_multiplier: { type: number }
        relevance_source: { type: string, enum: [rrf, rerank] }
        relevance_multiplier: { type: number }

    # ===== Ingest =====
    StartIngestRunRequest:
      type: object
      required: [ingest_cli_version, embedding_model]
      properties:
        ingest_cli_version: { type: string }
        embedding_model: { type: string, description: "{name}@{revision}" }
        note: { type: string }

    StartIngestRunResponse:
      type: object
      properties:
        ingest_run_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        source_version_revision: { type: integer }

    UploadDocumentsRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentUpload' }

    DocumentUpload:
      type: object
      required: [path, kind, content_hash, provenance, chunks]
      properties:
        path: { type: string }
        kind: { type: string, enum: [markdown, code, plaintext] }
        content_hash: { type: string }
        source_url: { type: string, nullable: true }
        published_url: { type: string, nullable: true }
        language: { type: string, nullable: true }
        source_modified_at: { type: string, format: date-time, nullable: true }
        frontmatter: { type: object, nullable: true }
        provenance: { $ref: '#/components/schemas/Provenance' }
        package: { $ref: '#/components/schemas/PackageUpload', nullable: true }
        char_count: { type: integer }
        token_count: { type: integer }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/ChunkUpload' }

    PackageUpload:
      type: object
      properties:
        kind: { type: string }
        name: { type: string }
        version: { type: string, nullable: true }
        manifest_path: { type: string, nullable: true }

    ChunkUpload:
      type: object
      required: [chunk_index, total_chunks, content, content_hash, status]
      properties:
        chunk_index: { type: integer }
        total_chunks: { type: integer }
        content: { type: string }
        content_hash: { type: string }
        embedding:
          type: array
          items: { type: number }
          nullable: true
        heading_path: { type: array, items: { type: string } }
        symbol_path: { type: array, items: { type: string } }
        start_byte: { type: integer }
        end_byte: { type: integer }
        token_count: { type: integer }
        status: { type: string, enum: [ready, embed_failed, deprecated] }

    UploadDocumentsResponse:
      type: object
      properties:
        accepted: { type: integer }
        conflicts:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              reason: { type: string }

    FinalizeResult:
      type: object
      properties:
        source_version_id: { type: string, format: uuid }
        revision: { type: integer }
        is_active: { type: boolean }
        demoted_revision: { type: integer, nullable: true }

    PromoteResult:
      type: object
      properties:
        promoted_revision: { type: integer }
        demoted_revision: { type: integer, nullable: true }

    CreateSourceRequest:
      type: object
      required: [slug, kind]
      properties:
        slug: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [docs_site, code_repo, standalone, mixed] }
        origin_url: { type: string }
        retention_count: { type: integer, default: 5 }

    UpdateSourceRequest:
      type: object
      properties:
        display_name: { type: string }
        origin_url: { type: string }
        retention_count: { type: integer }

    RateLimitOverride:
      type: object
      properties:
        id: { type: string, format: uuid }
        cidr: { type: string }
        limit_rps: { type: integer }
        expires_at: { type: string, format: date-time }
        note: { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    CreateRateLimitOverrideRequest:
      type: object
      required: [cidr, limit_rps, expires_at]
      properties:
        cidr: { type: string }
        limit_rps: { type: integer }
        expires_at: { type: string, format: date-time }
        note: { type: string }

    TelemetryRejection:
      type: object
      properties:
        index: { type: integer }
        reason: { type: string }
        field: { type: string, nullable: true }

  responses:
    InvalidRequest:
      description: 400 invalid_request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 401 unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 403 forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 404 not_found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EmbeddingModelMismatch:
      description: 409 embedding_model_mismatch
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: 410 gone (retired version)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 413 payload_too_large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 429 rate_limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: 503 service_unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QueryTimeout:
      description: 504 query_timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
