openapi: 3.1.0
info:
  title: midnight-manual cloud API
  version: 1.0.0
  description: |
    HTTP API for the midnight-manual cloud server. Implements Stories 4 (read API),
    9 (auth + write API + admin), 11 (telemetry + metrics) from `specs/001-rag-platform/spec.md`.

    Every response carries `X-Request-Id`. Every 4xx/5xx uses the typed error envelope
    (see `Error`).

servers:
  - url: https://manual.midnight.network/v1
    description: Production

paths:
  # ===== Read API (Story 4) =====
  /search:
    post:
      operationId: search
      summary: Hybrid search (FTS + vector + RRF; optional reranking client-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: >-
            400 invalid_request. A well-formed filter object that fails registry
            validation (e.g. a value outside a closed enum, `none_of` on a
            non-negatable facet, an unparseable `version_satisfies`, or a
            contradictory range) is rejected here, naming the offending facet and
            pointing at GET /v1/facets. Also covers the other request-shape
            failures (missing `client_embedding_model` in hybrid/vector mode,
            mutually-exclusive query forms, empty query text, etc.).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/EmbeddingModelMismatch' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: >-
            422 unprocessable_entity. The `filters` object is structurally
            malformed — an unknown filter key, an unknown nested field, or a
            type-mismatched value — so the typed deserializer rejects it before
            registry validation runs. (Well-formed-but-semantically-invalid
            filters that deserialize cleanly but fail registry validation return
            400 invalid_request instead.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/QueryTimeout' }

  /facets:
    get:
      operationId: getFacets
      summary: Discover the filterable search facets, their types, and corpus-derived values
      description: >-
        Public read endpoint (same posture as /search). Two modes. Overview
        (no params): advertises the available `mode` values and the per-facet
        filter universe so a client can build a valid `filters` object for
        /search. Closed-enum facets carry their complete `values` list;
        corpus-derived open sets (`language`, `source_slug`, `tags`, `package`)
        carry at most 10 sample `values` plus `truncated` and an exact `total`;
        high-cardinality facets (`symbol`, `heading_path`) advertise their type
        only. Backed by a short-lived server-side cache. Drill-down
        (`?facet=<key>`): one keyset-paginated page of distinct values for a
        single drillable open-set facet, never cached.
      parameters:
        - name: facet
          in: query
          required: false
          description: >-
            Switch to drill-down mode and return a paginated value list for
            this one facet. Only the drillable open-set facets are accepted
            (closed-enum facets list all values in the overview; `symbol` /
            `heading_path` are not drillable).
          schema: { type: string, enum: [source_slug, language, tags, package] }
        - name: cursor
          in: query
          required: false
          description: >-
            Drill-down only. Opaque resume token from the previous page's
            `next_cursor`; omit for the first page.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Drill-down only. Page size.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: >-
            Overview body when `facet` is absent; one drill-down page when
            `facet` is present.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FacetsResponse'
                  - $ref: '#/components/schemas/FacetValuesPage'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /sources:
    get:
      operationId: listSources
      summary: List sources (filterable, keyset-paginated on slug)
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque resume token from the previous page's `next_cursor`; omit
            for the first page.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: created_after
          in: query
          required: false
          description: Only sources created strictly after this RFC3339 timestamp.
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          required: false
          description: Only sources created strictly before this RFC3339 timestamp.
          schema: { type: string, format: date-time }
        - name: kind
          in: query
          required: false
          description: Only sources of this kind.
          schema: { type: string, enum: [docs_site, code_repo, standalone, mixed] }
        - name: retired
          in: query
          required: false
          description: Include retired sources (default false = active only).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
    post:
      operationId: createSource
      summary: Create a source (admin)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSource
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSource
      summary: Update source metadata (admin)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSourceRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}/retire:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retireSource
      summary: Retire an entire source (admin)
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}/versions:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listSourceVersions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceVersion' }

  /sources/{slug}/versions/{revision}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: revision
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getSourceVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /sources/{slug}/versions/{revision}/promote:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: revision
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: promoteSourceVersion
      summary: Promote a historical version to active (admin; rollback)
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sources/{slug}/versions/{revision}/retire:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: revision
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: retireSourceVersion
      summary: Retire a specific historical version (admin)
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK

  # ===== Ingest write protocol (Story 9) =====
  /sources/{slug}/ingest-runs:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: startIngestRun
      summary: Allocate a new source_version in 'building' state (admin)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartIngestRunRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartIngestRunResponse' }

  /sources/{slug}/ingest-runs/{id}/documents:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: uploadDocuments
      summary: Batch upload documents+chunks (idempotent on content hashes)
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadDocumentsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadDocumentsResponse' }
        '409':
          description: Run aborted or finalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sources/{slug}/ingest-runs/{id}/finalize:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: finalizeIngestRun
      summary: Atomically flip the new source_version to active
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizeResult' }

  /sources/{slug}/ingest-runs/{id}/abort:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: abortIngestRun
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK

  # ===== Chunks and traversal (Story 4) =====
  /chunks:
    get:
      operationId: getChunksBatch
      summary: Batch chunk fetch by id (order-preserving)
      parameters:
        - name: ids
          in: query
          required: true
          description: >-
            Comma-separated chunk UUIDs, 1-20 per request. Results come back
            in input order; ids that resolve to nothing — and repeats of an id
            already returned — land in `missing` instead of erroring the
            whole batch.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkBatch' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /chunks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getChunk
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chunks/{id}/siblings:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getChunkSiblings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChunkResult' }

  /chunks/{id}/parents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getChunkParents
      summary: Walk the chunk's parent chain (immediate parent → root)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentChain' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDocument
      summary: Document overview (document row + source + ordered chunk skeletons)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentOverview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/chunks:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDocumentChunks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChunkResult' }

  /nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getNode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }

  /nodes/{id}/children:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getNodeChildren
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Node' }

  /models/active:
    get:
      operationId: getActiveEmbeddingModel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingModel' }

  # ===== Introspection =====
  /me:
    get:
      operationId: getMe
      summary: Auth + limit introspection for the calling client
      description: >-
        Public read endpoint; anonymous calls succeed and report
        `authenticated: false`. Reports BOTH independent limit systems the
        caller carries: the request rate limit (`rate_limit`, req/s token
        bucket, peeked without spending a token) and the embedding token
        budget (`token_limits`, rolling hourly/daily windows charged by
        POST /v1/embeddings). NOTE the deliberate units asymmetry:
        `rate_limit.reset_secs` is RELATIVE (seconds from now) while the
        `token_limits` windows report ABSOLUTE `reset_at_secs` (unix epoch
        seconds) — see `Me`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  # ===== Auth (Story 9) =====
  /auth/challenge:
    post:
      operationId: authChallenge
      summary: Begin Ed25519 challenge-response (D10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
              required: [user_id]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce: { type: string }
                  expires_at: { type: string, format: date-time }
                required: [nonce, expires_at]

  /auth/verify:
    post:
      operationId: authVerify
      summary: Complete challenge-response and mint admin JWT (D21)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                nonce: { type: string }
                signature: { type: string, description: "base64-encoded Ed25519 signature" }
              required: [user_id, nonce, signature]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt: { type: string }
                  expires_at: { type: string, format: date-time }
                required: [jwt, expires_at]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/github/start:
    get:
      operationId: authGithubStart
      summary: Begin GitHub OAuth flow (FR-115)
      responses:
        '302':
          description: Redirect to GitHub
          headers:
            Location:
              schema: { type: string }

  /auth/github/callback:
    get:
      operationId: authGithubCallback
      summary: Exchange GitHub code for read-uplift bearer (FR-117)
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bearer_token: { type: string }
                  expires_at: { type: string, format: date-time }
                  github_login: { type: string }
                required: [bearer_token, expires_at, github_login]
        '403':
          description: User not a member of the configured Midnight org
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ===== Admin (Story 9) =====
  /admin/ratelimits:
    get:
      operationId: listRateLimitOverrides
      security:
        - adminJwt: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RateLimitOverride' }
    post:
      operationId: createRateLimitOverride
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRateLimitOverrideRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitOverride' }

  /admin/ratelimits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: extendRateLimitOverride
      security:
        - adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at: { type: string, format: date-time }
              required: [expires_at]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitOverride' }
    delete:
      operationId: deleteRateLimitOverride
      security:
        - adminJwt: []
      responses:
        '204':
          description: No Content

  # ===== Telemetry & ops (Story 11) =====
  /telemetry:
    post:
      operationId: postTelemetry
      summary: Submit a batch of telemetry events (D27, FR-116; anonymous, dedicated rate-limit bucket)
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: NDJSON; one TelemetryEvent per line.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryRejection' }

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus exposition (FR-111)
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: Process is alive

  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Ready (DB reachable, user store loaded, model registry seeded)
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT minted via Ed25519 challenge-response (D21)
    readUplift:
      type: http
      scheme: bearer
      description: GitHub-SSO-minted read-uplift bearer (D11/FR-117)

  schemas:
    # ===== Errors =====
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, remediation]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - embedding_model_mismatch
                - run_aborted
                - run_already_finalized
                - nonce_consumed
                - nonce_expired
                - gone
                - payload_too_large
                - rate_limited
                - service_unavailable
                - query_timeout
                - schema_missing
                - unsupported_field
                - internal
            message: { type: string }
            remediation: { type: string }
            context: { type: object, additionalProperties: true }
        request_id: { type: string }

    # ===== Core entities =====
    Source:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [docs_site, code_repo, standalone, mixed] }
        origin_url: { type: string, nullable: true }
        retention_count: { type: integer, minimum: 1, maximum: 50 }
        created_at: { type: string, format: date-time }
        retired_at: { type: string, format: date-time, nullable: true }

    SourceSummary:
      type: object
      description: Minimal source context bundled into navigation responses.
      properties:
        slug: { type: string }
        display_name: { type: string }

    SourcePage:
      type: object
      required: [sources, total, next_cursor]
      description: >-
        GET /v1/sources body — one keyset page (ordered by slug) plus
        pagination facts.
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        total:
          type: integer
          description: Total rows matching the filters (cursor ignored).
        next_cursor:
          type: string
          nullable: true
          description: >-
            Opaque resume token for the next page; `null` on the last page.
            Pass back verbatim as `?cursor=`.

    SourceVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        revision: { type: integer }
        status: { type: string, enum: [building, active, inactive, aborted, retired] }
        is_active: { type: boolean }
        ingested_at: { type: string, format: date-time }
        ingest_cli_version: { type: string }
        embedding_model: { $ref: '#/components/schemas/EmbeddingModel' }
        content_hash: { type: string }
        notes: { type: string, nullable: true }
        retired_at: { type: string, format: date-time, nullable: true }

    EmbeddingModel:
      type: object
      properties:
        name: { type: string }
        revision: { type: integer }
        dim: { type: integer }
        provider: { type: string }
        wire: { type: string, description: "{name}@{revision} wire form" }

    Node:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_node_id: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [root, group, document, chunk] }
        name: { type: string }
        order_index: { type: integer }

    ParentNode:
      type: object
      description: >-
        One ancestor in a chunk's parent chain. Unlike the generic Node,
        `kind` never takes the value `chunk`, and document-kind nodes carry
        their fetchable `document_id`.
      properties:
        id:
          type: string
          format: uuid
          description: Node id (structural hierarchy id — NOT a document id).
        source_version_id: { type: string, format: uuid }
        parent_node_id:
          type: string
          format: uuid
          nullable: true
          description: "`null` for the root."
        kind: { type: string, enum: [document, group, root] }
        name: { type: string, description: "File or folder name; `root` for the root." }
        order_index: { type: integer }
        document_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The fetchable document id (feed to GET /v1/documents/{id});
            present only on `kind == "document"` nodes, `null` on group/root.

    ParentChain:
      type: object
      required: [parents, source]
      description: >-
        GET /v1/chunks/{id}/parents body. `parents` is ordered immediate
        parent → root (for a chunk the first entry is its document node,
        followed by the enclosing groups, ending at the implicit root).
      properties:
        parents:
          type: array
          items: { $ref: '#/components/schemas/ParentNode' }
        source: { $ref: '#/components/schemas/SourceSummary' }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [markdown, code, plaintext] }
        source_url: { type: string, nullable: true }
        published_url: { type: string, nullable: true }
        source_path: { type: string }
        language: { type: string, nullable: true }
        frontmatter: { type: object, nullable: true, additionalProperties: true }
        provenance: { $ref: '#/components/schemas/Provenance' }
        package: { $ref: '#/components/schemas/Package', nullable: true }

    Package:
      type: object
      properties:
        kind: { type: string, enum: [rust, npm, compact, other] }
        name: { type: string }
        version: { type: string, nullable: true }
        manifest_path: { type: string, nullable: true }

    Provenance:
      type: object
      properties:
        attribution: { type: string, enum: [foundation, partner, third_party, community, unknown] }
        verified: { type: boolean }
        verified_by: { type: string, nullable: true }
        verified_at: { type: string, format: date, nullable: true }
        verification_notes: { type: string, nullable: true }
        language_targets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              version_constraint: { type: string }
        sdk_dependencies:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [npm, cargo, compact] }
              name: { type: string }
              version_constraint: { type: string }
        deprecation:
          type: object
          properties:
            is_deprecated: { type: boolean }
            since: { type: string, format: date, nullable: true }
            reason: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        content_type: { type: string, enum: [doc, tutorial, reference, example, contract_source, sdk_source, test, readme] }

    Chunk:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        chunk_index: { type: integer }
        total_chunks: { type: integer }
        heading_path: { type: array, items: { type: string } }
        symbol_path: { type: array, items: { type: string } }
        start_byte: { type: integer }
        end_byte: { type: integer }
        token_count: { type: integer }
        status: { type: string, enum: [ready, embed_failed, deprecated] }

    ChunkSkeleton:
      type: object
      required: [id, chunk_index, token_count]
      description: >-
        Per-chunk skeleton entry in a document overview — position + cost,
        no body.
      properties:
        id:
          type: string
          format: uuid
          description: Chunk id (feed to GET /v1/chunks?ids=).
        chunk_index: { type: integer, description: Position within the document. }
        token_count: { type: integer, description: Token count of the chunk body. }

    DocumentOverview:
      description: >-
        GET /v1/documents/{id} body — the complete Document row flattened at
        the top level, plus the owning source's summary and ordered chunk
        skeletons. No chunk bodies.
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          required: [source, chunks]
          properties:
            source: { $ref: '#/components/schemas/SourceSummary' }
            chunks:
              type: array
              description: >-
                Ready chunk skeletons in chunk_index order (embed_failed
                chunks excluded).
              items: { $ref: '#/components/schemas/ChunkSkeleton' }

    # ===== Search =====
    SearchRequest:
      type: object
      description: >-
        Provide EITHER `queries` (canonical multi-query form) OR the single-query
        convenience pair `query` + `vector`. The two are mutually exclusive; the
        convenience form behaves identically to a one-element `queries` array.

        `client_embedding_model` is REQUIRED for `hybrid` and `vector` modes (the
        request is rejected 400 invalid_request without it) and is optional /
        ignored for `fts` mode (which skips embedding entirely). It is therefore
        not unconditionally required at the schema level.
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [text, vector]
            properties:
              text: { type: string, minLength: 1 }
              vector:
                type: array
                items: { type: number }
                minItems: 768
                maxItems: 768
        query:
          type: string
          minLength: 1
          description: Single-query convenience form text (pairs with `vector`; mutually exclusive with `queries`).
        vector:
          type: array
          items: { type: number }
          minItems: 768
          maxItems: 768
          description: Single-query convenience form embedding (pairs with `query`).
        client_embedding_model:
          type: string
          description: >-
            {name}@{revision} per FR-039. Required for hybrid/vector mode;
            optional/ignored for fts.
        mode:
          type: string
          enum: [hybrid, vector, fts]
          default: hybrid
          description: "fts skips embedding; vector is semantic-only; hybrid fuses both"
        limit: { type: integer, default: 20, minimum: 1, maximum: 100 }
        sort_by: { type: string, enum: [confidence, trust, relevance, score], default: confidence }
        min_confidence: { type: number, default: 0.0, minimum: 0.0, maximum: 1.0 }
        filters: { $ref: '#/components/schemas/SearchFilters' }
        include_scores: { type: boolean, default: true }

    SearchFilters:
      type: object
      additionalProperties: false
      description: >-
        Per-facet filter object. AND across facets; OR within a facet's `any_of`;
        exclude a facet's `none_of`. Every facet defaults to absent, so an empty
        object imposes no constraints, and unknown keys are rejected (the typed
        deserializer 422s on an unknown facet; a well-formed-but-invalid value —
        e.g. a value outside a closed enum — is a 400). Set facets carry
        `{any_of, none_of}` (non-negatable facets omit `none_of`); `verified` /
        `deprecated` are bare booleans; temporal ranges are `{after, before}`
        (ISO dates); numeric ranges are `{min, max}`. Call GET /v1/facets to learn
        valid values for the closed-enum and corpus-derived facets. Mirrors
        `mn_retrieval::filters::SearchFilters`.
      properties:
        attribution:
          type: object
          additionalProperties: false
          description: Provenance attribution (closed enum).
          properties:
            any_of:
              type: array
              items: { type: string, enum: [foundation, partner, third_party, community, unknown] }
            none_of:
              type: array
              items: { type: string, enum: [foundation, partner, third_party, community, unknown] }
        content_type:
          type: object
          additionalProperties: false
          description: Document content type (closed enum).
          properties:
            any_of:
              type: array
              items: { type: string, enum: [doc, tutorial, reference, example, contract_source, sdk_source, test, readme, other] }
            none_of:
              type: array
              items: { type: string, enum: [doc, tutorial, reference, example, contract_source, sdk_source, test, readme, other] }
        kind:
          type: object
          additionalProperties: false
          description: Chunk content kind (closed enum).
          properties:
            any_of:
              type: array
              items: { type: string, enum: [markdown, code, plaintext] }
            none_of:
              type: array
              items: { type: string, enum: [markdown, code, plaintext] }
        source_kind:
          type: object
          additionalProperties: false
          description: Source kind (closed enum).
          properties:
            any_of:
              type: array
              items: { type: string, enum: [docs_site, code_repo, standalone, mixed] }
            none_of:
              type: array
              items: { type: string, enum: [docs_site, code_repo, standalone, mixed] }
        source_slug:
          type: object
          additionalProperties: false
          description: Source slug (open set; corpus-derived values via GET /v1/facets).
          properties:
            any_of:
              type: array
              items: { type: string }
            none_of:
              type: array
              items: { type: string }
        language:
          type: object
          additionalProperties: false
          description: Programming/markup language (open set; corpus-derived values).
          properties:
            any_of:
              type: array
              items: { type: string }
            none_of:
              type: array
              items: { type: string }
        tags:
          type: object
          additionalProperties: false
          description: Provenance tags (open set; corpus-derived top-N values).
          properties:
            any_of:
              type: array
              items: { type: string }
            none_of:
              type: array
              items: { type: string }
        heading_path:
          type: object
          additionalProperties: false
          description: Chunk heading-path segments (open set; not enumerated by GET /v1/facets).
          properties:
            any_of:
              type: array
              items: { type: string }
            none_of:
              type: array
              items: { type: string }
        symbol:
          type: object
          additionalProperties: false
          description: >-
            Symbol set-match over `{kind?, name?}` elements (both optional;
            `kind` and `name` are both open/chunker-derived).
          properties:
            any_of:
              type: array
              items: { $ref: '#/components/schemas/SymbolMatch' }
            none_of:
              type: array
              items: { $ref: '#/components/schemas/SymbolMatch' }
        package:
          type: object
          additionalProperties: false
          description: >-
            Package set-match over `{kind, name}` elements (both required;
            `kind` is a closed enum, `name` is open/corpus-derived).
          properties:
            any_of:
              type: array
              items: { $ref: '#/components/schemas/PackageMatch' }
            none_of:
              type: array
              items: { $ref: '#/components/schemas/PackageMatch' }
        verified:
          type: boolean
          description: Restrict to documents whose provenance `verified` flag equals this value.
        deprecated:
          type: boolean
          description: Restrict to chunks whose `deprecated` flag equals this value.
        language_target:
          type: object
          additionalProperties: false
          description: >-
            Language-target set-match (NOT negatable — `any_of` only). OR within
            `any_of`; each element matches by `name`, optionally refined by a
            server-side semver check on `version_satisfies` (FR-033).
          properties:
            any_of:
              type: array
              items: { $ref: '#/components/schemas/LanguageTargetMatch' }
        sdk_dependency:
          type: object
          additionalProperties: false
          description: >-
            SDK-dependency set-match (NOT negatable — `any_of` only). OR within
            `any_of`; each element matches by `kind` + `name`, optionally refined
            by a server-side semver check on `version_satisfies` (FR-033).
          properties:
            any_of:
              type: array
              items: { $ref: '#/components/schemas/SdkDependencyMatch' }
        ingested_at:
          type: object
          additionalProperties: false
          description: Inclusive ingestion-timestamp range (ISO dates).
          properties:
            after: { type: string, format: date }
            before: { type: string, format: date }
        source_modified_at:
          type: object
          additionalProperties: false
          description: Inclusive upstream source-modified-timestamp range (ISO dates).
          properties:
            after: { type: string, format: date }
            before: { type: string, format: date }
        token_count:
          type: object
          additionalProperties: false
          description: Inclusive chunk token-count range.
          properties:
            min: { type: integer }
            max: { type: integer }

    SymbolMatch:
      type: object
      additionalProperties: false
      description: One `symbol` element. Both fields optional; absent means "any".
      properties:
        kind:
          type: string
          description: >-
            Open, chunker-derived syntactic kind (e.g. `fn`, `struct`, `impl`,
            `method`, `class`, `trait`, `interface`, `module`, `enum`, ...). Not
            a closed enum — values come from the corpus, like `language`/`tags`.
        name: { type: string }

    PackageMatch:
      type: object
      additionalProperties: false
      required: [kind, name]
      description: One `package` element.
      properties:
        kind: { type: string, enum: [rust, npm, compact, other] }
        name: { type: string }

    LanguageTargetMatch:
      type: object
      additionalProperties: false
      required: [name]
      description: One `language_target` element; semver evaluated server-side post-fetch.
      properties:
        name: { type: string }
        version_satisfies: { type: string, description: Optional semver requirement (FR-033). }

    SdkDependencyMatch:
      type: object
      additionalProperties: false
      required: [kind, name]
      description: One `sdk_dependency` element; semver evaluated server-side post-fetch.
      properties:
        kind: { type: string }
        name: { type: string }
        version_satisfies: { type: string, description: Optional semver requirement (FR-033). }

    FacetsResponse:
      type: object
      required: [modes, filters]
      description: GET /v1/facets body. Mirrors `mn_server::routes::facets`.
      properties:
        modes:
          type: array
          description: The accepted `mode` values for /search.
          items: { type: string, enum: [hybrid, vector, fts] }
        filters:
          type: array
          items: { $ref: '#/components/schemas/FacetDescriptor' }

    FacetDescriptor:
      type: object
      required: [key, type, negatable]
      description: >-
        One filterable facet. `values` is present for closed enums (the
        complete allowed set) and for corpus-derived open sets (`language`,
        `source_slug`, `tags`, `package`); for the corpus-derived sets
        `truncated` / `total` are also present. `symbol` and `heading_path`
        advertise type only.
      properties:
        key: { type: string, description: The wire key used inside a `filters` object. }
        type:
          type: string
          enum: [enum, open_set, object_set, bool, range_temporal, range_numeric]
        negatable:
          type: boolean
          description: Whether the facet accepts a `none_of` exclusion clause.
        values:
          type: array
          description: >-
            Allowed values (closed enums: the complete set) or corpus-derived
            sample values (open sets: at most 10 — fetch the rest via the
            `?facet=` drill-down). Absent for object-set/range/bool facets and
            for non-enumerated open sets (`symbol`, `heading_path`).
          items: { type: string }
        truncated:
          type: boolean
          description: >-
            Present only for corpus-derived open sets; true when more distinct
            values exist than are listed in `values` (fetch the rest via the
            `?facet=` drill-down).
        total:
          type: integer
          description: >-
            Present only for corpus-derived open sets; EXACT count of distinct
            values in the active corpus (not capped at the sample size).

    FacetValuesPage:
      type: object
      required: [facet, values, total, next_cursor]
      description: >-
        One drill-down page (GET /v1/facets?facet=...) of distinct values for
        a single drillable open-set facet, ordered by value text.
      properties:
        facet: { type: string, enum: [source_slug, language, tags, package] }
        values:
          type: array
          items: { type: string }
        total:
          type: integer
          description: >-
            Exact count of distinct values in the active corpus (cursor
            ignored); matches the overview's `total` for the same facet.
        next_cursor:
          type: string
          nullable: true
          description: >-
            Opaque resume token for the next page; `null` on the last page.
            Pass back verbatim as `?cursor=`.

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ChunkResult' }
        corpus_embedding_model: { type: string, description: "{name}@{revision}" }
        search_metadata:
          type: object
          properties:
            took_ms: { type: integer }
            returned: { type: integer }
            filtered_by_confidence: { type: integer }
            sort_by: { type: string }
            deduplicated_count: { type: integer }
            per_query:
              type: array
              items:
                type: object
                properties:
                  query_index: { type: integer }
                  fts_candidates: { type: integer }
                  vector_candidates: { type: integer }
                  fts_latency_ms: { type: integer }
                  vector_latency_ms: { type: integer }
            fts_zero_matches: { type: boolean }
            limit_capped: { type: boolean }

    ChunkResult:
      type: object
      properties:
        chunk: { $ref: '#/components/schemas/Chunk' }
        document: { $ref: '#/components/schemas/Document' }
        source: { $ref: '#/components/schemas/Source' }
        source_version: { $ref: '#/components/schemas/SourceVersion' }
        package: { $ref: '#/components/schemas/Package', nullable: true }
        parent_chain:
          type: array
          items: { $ref: '#/components/schemas/Node' }
        navigation:
          type: object
          properties:
            prev_chunk_id: { type: string, format: uuid, nullable: true }
            next_chunk_id: { type: string, format: uuid, nullable: true }
        source_slug: { type: string }
        source_display_name: { type: string }
        source_path: { type: string, description: "Source-relative document path, e.g. docs/intro.md" }
        published_url: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        heading_path: { type: array, items: { type: string } }
        symbol_path: { type: array, items: { type: string } }
        scores:
          type: object
          description: >-
            Per-result scores. Omitted entirely when the request sets
            include_scores=false. trust_score, confidence, and
            confidence_factors are the US6 (D24) additive fields.
          properties:
            rrf_score: { type: number }
            vector_similarity: { type: number }
            matched_queries:
              type: array
              items: { type: integer }
            trust_score: { type: number, minimum: 0, maximum: 1 }
            confidence: { type: number, minimum: 0, maximum: 1 }
            confidence_factors: { $ref: '#/components/schemas/ConfidenceFactors' }

    ConfidenceFactors:
      type: object
      properties:
        attribution: { type: string }
        attribution_multiplier: { type: number }
        verified: { type: boolean }
        verified_by: { type: string, nullable: true }
        verification_multiplier: { type: number }
        age_days: { type: integer }
        freshness_multiplier: { type: number }
        deprecation: { type: boolean }
        deprecation_multiplier: { type: number }
        language_target_query: { type: object, nullable: true }
        language_targets_chunk: { type: array, items: { type: object } }
        version_match_multiplier: { type: number }
        relevance_source: { type: string, enum: [rrf, rerank] }
        relevance_multiplier: { type: number }

    ChunkBatch:
      type: object
      required: [chunks, missing]
      description: >-
        GET /v1/chunks?ids= body. `chunks` preserves the input id order; ids
        that resolved to nothing — and duplicate input ids beyond their first
        occurrence — appear in `missing`.
      properties:
        chunks:
          type: array
          items: { $ref: '#/components/schemas/ChunkResult' }
        missing:
          type: array
          items: { type: string, format: uuid }

    # ===== Ingest =====
    StartIngestRunRequest:
      type: object
      required: [ingest_cli_version, embedding_model]
      properties:
        ingest_cli_version: { type: string }
        embedding_model: { type: string, description: "{name}@{revision}" }
        note: { type: string }

    StartIngestRunResponse:
      type: object
      properties:
        ingest_run_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        source_version_revision: { type: integer }

    UploadDocumentsRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/DocumentUpload' }

    DocumentUpload:
      type: object
      required: [path, kind, content_hash, provenance, chunks]
      properties:
        path: { type: string }
        kind: { type: string, enum: [markdown, code, plaintext] }
        content_hash: { type: string }
        source_url: { type: string, nullable: true }
        published_url: { type: string, nullable: true }
        language: { type: string, nullable: true }
        source_modified_at: { type: string, format: date-time, nullable: true }
        frontmatter: { type: object, nullable: true }
        provenance: { $ref: '#/components/schemas/Provenance' }
        package: { $ref: '#/components/schemas/PackageUpload', nullable: true }
        char_count: { type: integer }
        token_count: { type: integer }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/ChunkUpload' }

    PackageUpload:
      type: object
      properties:
        kind: { type: string }
        name: { type: string }
        version: { type: string, nullable: true }
        manifest_path: { type: string, nullable: true }

    ChunkUpload:
      type: object
      required: [chunk_index, total_chunks, content, content_hash, status]
      properties:
        chunk_index: { type: integer }
        total_chunks: { type: integer }
        content: { type: string }
        content_hash: { type: string }
        embedding:
          type: array
          items: { type: number }
          nullable: true
        heading_path: { type: array, items: { type: string } }
        symbol_path: { type: array, items: { type: string } }
        start_byte: { type: integer }
        end_byte: { type: integer }
        token_count: { type: integer }
        status: { type: string, enum: [ready, embed_failed, deprecated] }

    UploadDocumentsResponse:
      type: object
      properties:
        accepted: { type: integer }
        conflicts:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              reason: { type: string }

    FinalizeResult:
      type: object
      properties:
        source_version_id: { type: string, format: uuid }
        revision: { type: integer }
        is_active: { type: boolean }
        demoted_revision: { type: integer, nullable: true }

    PromoteResult:
      type: object
      properties:
        promoted_revision: { type: integer }
        demoted_revision: { type: integer, nullable: true }

    CreateSourceRequest:
      type: object
      required: [slug, kind]
      properties:
        slug: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [docs_site, code_repo, standalone, mixed] }
        origin_url: { type: string }
        retention_count: { type: integer, default: 5 }

    UpdateSourceRequest:
      type: object
      properties:
        display_name: { type: string }
        origin_url: { type: string }
        retention_count: { type: integer }

    RateLimitOverride:
      type: object
      properties:
        id: { type: string, format: uuid }
        cidr: { type: string }
        limit_rps: { type: integer }
        expires_at: { type: string, format: date-time }
        note: { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    CreateRateLimitOverrideRequest:
      type: object
      required: [cidr, limit_rps, expires_at]
      properties:
        cidr: { type: string }
        limit_rps: { type: integer }
        expires_at: { type: string, format: date-time }
        note: { type: string }

    # ===== Introspection =====
    Me:
      type: object
      required: [authenticated, auth_type, identity, permission_level, rate_limit, token_limits, server_version]
      description: >-
        GET /v1/me body. The caller's two limit systems are independent and —
        deliberately, but easy to misread — use DIFFERENT time units:
        `rate_limit.reset_secs` is RELATIVE (seconds from now until the bucket
        refills), while the `token_limits` windows report ABSOLUTE
        `reset_at_secs` (unix epoch seconds when the window's oldest bucket
        expires).
      properties:
        authenticated: { type: boolean }
        auth_type:
          type: string
          enum: [anonymous, github_oauth, admin]
        identity:
          type: string
          nullable: true
          description: Token subject; `null` when anonymous.
        permission_level:
          type: string
          enum: [read, write, admin]
        rate_limit:
          type: object
          nullable: true
          description: >-
            Request rate-limit bucket snapshot (non-consuming peek; no token
            is spent answering /me). `null` when the rate limiter is disabled.
          properties:
            tier:
              type: string
              enum: [cidr_override, admin, read_uplift, anonymous]
            limit: { type: integer }
            remaining: { type: integer }
            reset_secs:
              type: integer
              description: >-
                RELATIVE seconds from now until the bucket refills (retry-after
                when `remaining` is 0). NOT a unix timestamp — contrast with
                `token_limits.*.reset_at_secs`.
        token_limits:
          type: object
          description: >-
            Embedding token budget (rolling hourly + daily windows, charged by
            POST /v1/embeddings).
          properties:
            tier:
              type: string
              enum: [anonymous, read_uplift, admin]
            hourly: { $ref: '#/components/schemas/TokenWindow' }
            daily: { $ref: '#/components/schemas/TokenWindow' }
        server_version: { type: string }

    TokenWindow:
      type: object
      description: One embedding-token window snapshot (see `Me.token_limits`).
      properties:
        limit: { type: integer, description: Configured token ceiling for this window. }
        remaining: { type: integer, description: Tokens remaining before the window is exhausted. }
        reset_at_secs:
          type: integer
          description: >-
            ABSOLUTE unix epoch seconds when the window's oldest bucket
            expires. NOT relative — contrast with `rate_limit.reset_secs`.

    TelemetryRejection:
      type: object
      properties:
        index: { type: integer }
        reason: { type: string }
        field: { type: string, nullable: true }

  responses:
    InvalidRequest:
      description: 400 invalid_request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 401 unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 403 forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 404 not_found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EmbeddingModelMismatch:
      description: 409 embedding_model_mismatch
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: 410 gone (retired version)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 413 payload_too_large
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 429 rate_limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: 503 service_unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QueryTimeout:
      description: 504 query_timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
