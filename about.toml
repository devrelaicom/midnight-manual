# cargo-about config for the THIRD-PARTY-LICENSES bundle attached to each Release.
# `cargo about generate about.hbs` enumerates the licences of every crate in the
# dependency graph. NOTE: the vendored tree-sitter Scheme grammar
# (crates/mnm-content/vendor/tree-sitter-scheme) is NOT a cargo crate, so it is
# appended separately by the release workflow (release.yml global job).
#
# `accepted` must mirror deny.toml's `allow` so the two stay consistent.

targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

ignore-dev-dependencies = true

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
